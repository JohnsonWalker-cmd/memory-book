<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Memory Book</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Sign-in screen -->
  <section id="auth-screen" class="screen">
    <div class="auth-card">
      <h1>Our Memory Book 💌</h1>
      <p class="subtitle">A little place to keep the two of us.</p>

      <button id="google-signin-btn" class="google-btn">
        <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/>
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.167 6.656 3.58 9 3.58z"/>
        </svg>
        Continue with Google
      </button>

      <p id="auth-message" class="auth-message" hidden></p>
    </div>
  </section>

  <!-- Main app -->
  <section id="app-screen" class="screen" hidden>
    <header class="app-header">
      <h1>Our Memory Book 💌</h1>
      <div class="header-right">
        <span id="user-email"></span>
        <button id="sign-out-btn" class="ghost-btn">Sign out</button>
      </div>
    </header>

    <main class="app-main">
      <button id="add-memory-btn" class="primary-btn">+ Add a memory</button>

      <div id="memories-list" class="memories-list"></div>
      <p id="empty-state" class="empty-state" hidden>No memories yet — add your first one!</p>
    </main>
  </section>

  <!-- Add memory modal -->
  <div id="add-memory-modal" class="modal-backdrop" hidden>
    <div class="modal">
      <h2>New memory</h2>
      <form id="add-memory-form">
        <label for="memory-title">Title</label>
        <input id="memory-title" type="text" required placeholder="Our first hike">

        <label for="memory-date">Date</label>
        <input id="memory-date" type="date" required>

        <label for="memory-description">Description</label>
        <textarea id="memory-description" rows="3" placeholder="What happened?"></textarea>

        <label for="memory-photo">Photo (optional)</label>
        <input id="memory-photo" type="file" accept="image/*">

        <div class="modal-actions">
          <button type="button" id="cancel-memory-btn" class="ghost-btn">Cancel</button>
          <button type="submit" class="primary-btn">Save memory</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Memory detail / notes modal -->
  <div id="detail-modal" class="modal-backdrop" hidden>
    <div class="modal detail-modal">
      <button id="close-detail-btn" class="close-btn" aria-label="Close">&times;</button>
      <div id="detail-content"></div>

      <h3>Notes</h3>
      <div id="notes-list" class="notes-list"></div>
      <form id="add-note-form">
        <input id="note-input" type="text" placeholder="Add a note..." required>
        <button type="submit" class="primary-btn">Add</button>
      </form>
    </div>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js"
    integrity="sha384-qafw21c/iciq0VXsi9FzkfoQv5I/V0iqE4lSNcKXPnW9/UTJLnv5CcN4FHxVLnKg"
    crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
